# Transitions automatisables (moteur supervise).
# Seule build.txt TERMINÉ + task_id -> reviewer est implementee (watcher).
transitions:
  - from: plan.txt
    status: À IMPLÉMENTER
    to: build-back
    auto: false
  - from: plan.txt
    status: À IMPLÉMENTER
    condition: design_required
    to: build-front
    auto: false
  - from: frontend.txt
    status: VALIDÉ
    to: build-back
    auto: false
  - from: backend.txt
    status: TERMINÉ
    to: reviewer
    auto: true
  - from: backend.txt
    status: TERMINÉ
    condition: security_required
    to: security
    auto: false
  - from: backend.txt
    status: TERMINÉ
    condition: visual_qa_required
    to: qa
    auto: false
  - from: review.txt
    status: CORRECTIONS NÉCESSAIRES
    to: build-back
    auto: false
