# Registre des fenêtres de contexte (lecture seule, observé par le dashboard).
#
# Ceci est un relevé ponctuel, PAS un catalogue officiel. Les modèles listés
# étaient observés via OpenCode au `verified_at` indiqué ; un fournisseur
# peut les retirer, les mettre derrière une formule payante ou en changer la
# fenêtre du jour au lendemain (constaté : des modèles apparaissent et
# disparaissent d'une semaine à l'autre). Une ligne ici ne dit rien de la
# disponibilité future d'un modèle, ni de son prix : ne jamais en déduire
# qu'un modèle est gratuit parce qu'il figure dans ce fichier.
#
# Ce fichier est la référence à consulter pour savoir quels modèles ont
# été observés comme disponibles (y compris gratuits) au moment du relevé.
# Le dashboard y lit les fenêtres de contexte pour calculer le pourcentage
# d'occupation ; sans entrée connue il affiche `n/d` plutôt qu'un chiffre
# inventé (tokens et coût restent affichés).
#
# Clé = identifiant complet `provider/model` (jamais le seul nom : deux
# fournisseurs peuvent proposer des variantes homonymes de limites
# différentes).
#
# Entretien :
#   * nouveau modèle observé -> ajouter son ID, son contexte et sa source ;
#   * fenêtre modifiée -> corriger `context_tokens` et `verified_at` ;
#   * modèle retiré du catalogue OpenCode -> la ligne peut rester (inerte)
#     ou être supprimée ; aucune suppression automatique n'est faite.
#
# Choix du modèle par agent :
#   * Les agents livrés par le noyau n'ont plus de `model:` par défaut.
#   * L'utilisateur choisit le modèle de chaque agent dans le frontmatter
#     de `.opencode/agent/<agent>.md` (`model: provider/model`), ou via
#     `sayrhazi.yaml`. Le watcher passe toujours ce modèle en `--model` :
#     la fiche du projet est la seule source de vérité.
#   * `core/runtime/models.yaml` n'écrase jamais le choix de l'utilisateur :
#     il sert uniquement de référence pour les fenêtres de contexte.

models:
  opencode/longcat-2.5-preview-free:
    context_tokens: 1000000
    source: releve manuel via opencode
    verified_at: "2026-10-15"
  opencode/muse-spark-1.3-contributor-free:
    context_tokens: 1048576
    source: releve manuel via opencode
    verified_at: "2026-10-15"
